<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My first website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: #eef3ff;
      color: #172033;
      font-family: Arial, Tahoma, sans-serif;
    }
    main {
      width: min(100%, 760px);
      padding: clamp(28px, 6vw, 64px);
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(25, 40, 70, .10);
      text-align: center;
    }
    h1 { margin: 0 0 18px; font-size: clamp(30px, 5vw, 48px); }
    p { color: #586174; font-size: 18px; line-height: 1.8; }
    button {
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      padding: 13px 24px;
      background: #315efb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
      <h1 dir="auto">Welcome to YasinCode!</h1>
      <p dir="auto">I am building my own programming language.</p>
      <button type="button" dir="auto">Get started</button>
  </main>
</body>
</html>
